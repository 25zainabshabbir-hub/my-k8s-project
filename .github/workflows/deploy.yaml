name: build-scan-deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ACR: k8slabzainab.azurecr.io
  ACR_NAME: k8slabzainab
  IMAGE: two-tier-api
  RG: k8slab-rg
  AKS: k8slab-aks
  VAULT: aks-ssap321

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed yet)
        run: docker build -t $ACR/$IMAGE:${{ github.sha }} .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR }}/${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push (only reached if scan passed)
        run: |
          az acr login --name $ACR_NAME
          docker push $ACR/$IMAGE:${{ github.sha }}

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials (with kubelogin)
        run: |
          sudo az aks install-cli
          az aks get-credentials -g $RG -n $AKS --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Fetch secrets from Key Vault and create k8s secret
        run: |
          PGUSER=$(az keyvault secret show --vault-name $VAULT --name postgres-user --query value -o tsv)
          echo "::add-mask::$PGUSER"
          PGPASS=$(az keyvault secret show --vault-name $VAULT --name postgres-password --query value -o tsv)
          echo "::add-mask::$PGPASS"
          kubectl create secret generic db-secret \
            --from-literal=POSTGRES_USER="$PGUSER" \
            --from-literal=POSTGRES_PASSWORD="$PGPASS" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$ACR/$IMAGE:${{ github.sha }}|" api-deployment.yaml
          kubectl apply -f configmap.yaml -f db-pvc.yaml -f db-deployment.yaml -f db-service.yaml -f api-deployment.yaml -f api-service.yaml -f ingress.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/api --timeout=180s
          kubectl get ingress
